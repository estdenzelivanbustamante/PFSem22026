<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Repartidor - Licorería Don Charles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-300 font-sans min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gray-800 p-4 shadow-md flex justify-between items-center border-b border-gray-700">
        <div class="flex items-center gap-3">
            <i class="fas fa-motorcycle text-2xl text-yellow-500"></i>
            <h1 class="text-xl font-bold text-white">Panel de Delivery</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-sm text-gray-400" id="nombre-repartidor">Cargando...</span>
            <button onclick="cerrarSesion()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-sm transition">
                <i class="fas fa-sign-out-alt mr-2"></i>Salir
            </button>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Columna Izquierda: Pedidos Disponibles -->
        <section class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
            <h2 class="text-xl font-bold text-white mb-4 border-b border-gray-700 pb-2">
                <i class="fas fa-box-open text-blue-400 mr-2"></i>Pedidos Disponibles
            </h2>
            <div id="contenedor-disponibles" class="space-y-4">
                <!-- Los pedidos esperando repartidor se inyectarán aquí -->
                <p class="text-gray-500 text-sm text-center py-4">Buscando pedidos nuevos...</p>
            </div>
        </section>

        <!-- Columna Derecha: Mis Pedidos en Camino -->
        <section class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
            <h2 class="text-xl font-bold text-white mb-4 border-b border-gray-700 pb-2">
                <i class="fas fa-route text-green-400 mr-2"></i>Mis Pedidos en Camino
            </h2>
            <div id="contenedor-activos" class="space-y-4">
                <!-- Los pedidos del repartidor actual se inyectarán aquí -->
                <p class="text-gray-500 text-sm text-center py-4">No tienes pedidos asignados actualmente.</p>
            </div>
        </section>

        <!-- Modal de Detalles del Pedido -->
        <div id="modal-detalles" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50">
            <div class="bg-gray-800 p-6 rounded-lg shadow-xl max-w-md w-full border border-gray-600">
                <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                    <h3 class="text-xl font-bold text-white">Detalles del Pedido <span id="modal-id-pedido"></span></h3>
                    <button onclick="cerrarModal()" class="text-gray-400 hover:text-red-500 transition">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div class="mb-4">
                    <p class="text-sm text-gray-400">Cliente:</p>
                    <p id="modal-cliente" class="text-white font-semibold mb-2"></p>
                </div>
                <div class="bg-gray-900 p-3 rounded-md mb-4 max-h-48 overflow-y-auto">
                    <ul id="modal-lista-productos" class="space-y-2">
                        <!-- Los productos se inyectarán aquí -->
                    </ul>
                </div>
                <div class="text-right">
                    <button onclick="cerrarModal()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded text-sm transition">
                        Cerrar
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Lógica del Repartidor -->
    <script>
        // Obtenemos los datos del repartidor logueado (asumiendo que los guardas en localStorage al hacer login)
        const repartidor = JSON.parse(sessionStorage.getItem('usuarioLogueado'));
        
        if (!repartidor || repartidor.ID_Rol !== 4) {
            // Si no es delivery, lo pateamos al login
            alert('Acceso denegado. Solo para personal de Delivery.');
            window.location.href = 'login.html';
        } else {
            document.getElementById('nombre-repartidor').textContent = `Hola, ${repartidor.Correo}`;
            cargarPedidos();
        }

        // Función para cargar todos los pedidos desde el backend
        async function cargarPedidos() {
            try {
                // Haremos una petición al backend (pronto crearemos este endpoint en server.js)
                const respuesta = await fetch('http://localhost:3000/api/pedidos/delivery');
                const pedidos = await respuesta.json();

                const disponibles = pedidos.filter(p => p.Estado === 'Esperando repartidor');
                const activos = pedidos.filter(p => p.ID_Delivery === repartidor.ID_Usuario && p.Estado === 'En camino');

                renderizarDisponibles(disponibles);
                renderizarActivos(activos);
            } catch (error) {
                console.error('Error al cargar pedidos:', error);
            }
        }

        function renderizarDisponibles(pedidos) {
            const contenedor = document.getElementById('contenedor-disponibles');
            if (pedidos.length === 0) {
                contenedor.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">No hay pedidos pendientes.</p>';
                return;
            }
            contenedor.innerHTML = pedidos.map(p => `
                <div class="bg-gray-700 p-4 rounded-md border-l-4 border-blue-500 flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-white font-bold">Pedido #${p.IdPedido}</p>
                            <p class="text-sm text-gray-400">Total: Bs. ${p.Total}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="verDetalles(${p.IdPedido})" class="bg-gray-600 hover:bg-gray-500 text-white px-3 py-1 rounded text-sm transition flex-1">
                            <i class="fas fa-eye mr-1"></i> Detalles
                        </button>
                        <button onclick="aceptarPedido(${p.IdPedido})" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm transition flex-1">
                            Aceptar
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderizarActivos(pedidos) {
            const contenedor = document.getElementById('contenedor-activos');
            if (pedidos.length === 0) {
                contenedor.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">No tienes pedidos asignados actualmente.</p>';
                return;
            }
            contenedor.innerHTML = pedidos.map(p => `
                <div class="bg-gray-700 p-4 rounded-md border-l-4 border-green-500 flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-white font-bold">Pedido #${p.IdPedido}</p>
                            <p class="text-sm text-gray-400">Total: Bs. ${p.Total}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="verDetalles(${p.IdPedido})" class="bg-gray-600 hover:bg-gray-500 text-white px-3 py-1 rounded text-sm transition flex-1">
                            <i class="fas fa-eye mr-1"></i> Detalles
                        </button>
                        <button onclick="marcarEntregado(${p.IdPedido})" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm transition flex-1">
                            Entregado
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // --- LÓGICA DEL MODAL ---
        async function verDetalles(idPedido) {
            try {
                const respuesta = await fetch(`http://localhost:3000/api/pedidos/${idPedido}/detalles`);
                const detalles = await respuesta.json();
                
                if(detalles.length > 0) {
                    document.getElementById('modal-id-pedido').textContent = `#${idPedido}`;
                    document.getElementById('modal-cliente').textContent = detalles[0].ClienteCorreo;
                    
                    const lista = document.getElementById('modal-lista-productos');
                    lista.innerHTML = detalles.map(d => `
                        <li class="text-sm text-gray-300 flex justify-between border-b border-gray-700 pb-1">
                            <span>${d.Cantidad}x ${d.Producto}</span>
                            <span>Bs. ${d.PrecioUnitario}</span>
                        </li>
                    `).join('');
                    
                    document.getElementById('modal-detalles').classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error al cargar detalles:', error);
                alert('No se pudieron cargar los detalles del pedido.');
            }
        }

        function cerrarModal() {
            document.getElementById('modal-detalles').classList.add('hidden');
        }

        // Función para aceptar un pedido (Pasa a "En camino")
        async function aceptarPedido(idPedido) {
            try {
                await fetch(`http://localhost:3000/api/pedidos/${idPedido}/aceptar`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idDelivery: repartidor.ID_Usuario })
                });
                cargarPedidos(); // Recargar la lista
            } catch (error) {
                alert('Error al aceptar el pedido');
            }
        }

        // Función para finalizar la entrega
        async function marcarEntregado(idPedido) {
            if(!confirm('¿Confirmas que entregaste este pedido?')) return;
            try {
                await fetch(`http://localhost:3000/api/pedidos/${idPedido}/estado`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado: 'Entregado' })
                });
                cargarPedidos(); // Recargar la lista
            } catch (error) {
                alert('Error al actualizar el estado');
            }
        }

        function cerrarSesion() {
            sessionStorage.removeItem('usuarioActivo');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
